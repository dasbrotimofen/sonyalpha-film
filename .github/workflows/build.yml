name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: .deps
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/dependencies.json', 'scripts/build.py') }}
      - name: Install toolchain
        run: python scripts/build.py setup
      - name: Build tools and verify both APKs
        run: python scripts/build.py all
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks-${{ runner.os }}
          path: |
            app/FilmSim.apk
            probe/FilmProbe.apk
          if-no-files-found: error
